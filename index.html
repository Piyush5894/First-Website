<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngiNotes - College & Engineering Study Hub</title>
    <meta name="description" content="Discover, share, and preview verified engineering lecture notes, handwritten summaries, PYQs, and branch syllabi." />
    <meta property="og:title" content="EngiNotes - College & Engineering Study Hub" />
    <meta property="og:description" content="Discover, share, and preview verified engineering lecture notes, handwritten summaries, PYQs, and branch syllabi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ensure directory URLs on GitHub Pages end with a trailing slash
      // e.g. https://<user>.github.io/<repo>/ so relative assets (./assets/...) load correctly
      (function() {
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var path = l.pathname;
          if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
            l.replace(l.protocol + '//' + l.host + path + '/' + l.search + l.hash);
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px;">
        <div style="max-width: 480px; background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center;">
          <div style="width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 26px;">
            📚
          </div>
          <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 8px; color: #ffffff;">EngiNotes Study Hub</h1>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 20px; line-height: 1.5;">
            Loading engineering notes, question papers, and study resources...
          </p>
          <div style="display: inline-block; width: 32px; height: 32px; border: 3px solid #1e293b; border-top-color: #38bdf8; border-radius: 50%; animation: enginotes-spin 0.8s linear infinite;"></div>
          <style>@keyframes enginotes-spin { to { transform: rotate(360deg); } }</style>
          <noscript>
            <div style="margin-top: 16px; padding: 10px; background: #451a03; border: 1px solid #78350f; border-radius: 8px; color: #fef3c7; font-size: 12px;">
              Please enable JavaScript in your browser to use EngiNotes.
            </div>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
