<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>EngiNotes - Redirecting...</title>
    <script>
      // Single Page Application redirect to repository root or /docs/ on GitHub Pages
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var basePath = '/';
      if (l.hostname.endsWith('github.io') && pathParts.length > 0) {
        basePath = '/' + pathParts[0] + (pathParts[1] === 'docs' ? '/docs/' : '/');
      }
      l.replace(l.protocol + '//' + l.host + basePath);
    </script>
  </head>
  <body style="background:#020617;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to EngiNotes...</p>
  </body>
</html>
